name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the release job opts into write access below.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sets docs_only for the validate gate below. Only pull_request is inspected;
  # on a push docs_only is empty, which reads as "not docs-only".
  detect:
    name: Detect docs-only changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base

      - name: Detect docs-only changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # The base branch tip; HEAD is the merge commit, so this covers the
          # whole pull request, not just the latest push.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"; echo "$files"
          # Anything not *.md and not under docs/ (or an empty diff) runs everything.
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "Docs only; skipping lint and validation."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not docs-only; running the full pipeline."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Linting and basic validation. Runs on every push and pull request.
  validate:
    name: Lint & validate
    needs: detect
    # A skipped job reports Success, which is what clears the required check.
    # !cancelled() so a FAILED detect runs everything rather than skipping into
    # a false Success.
    if: ${{ !cancelled() && needs.detect.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate POM
        run: mvn -B -ntp validate

      - name: Lint & compile
        # Compile against the provided Keycloak SPIs and lint via the Java
        # compiler: -Xlint:all surfaces all warnings and failOnWarning turns
        # them into build failures.
        run: >
          mvn -B -ntp clean compile
          -Dmaven.compiler.showWarnings=true
          -Dmaven.compiler.failOnWarning=true
          -Dmaven.compiler.compilerArgument=-Xlint:all

  # Build the provider jar and publish a GitHub Release. Only on main.
  build-and-release:
    name: Build & release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Opt into write access for creating/updating the release.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build package
        run: mvn -B -ntp clean package

      - name: Read project version
        id: version
        run: echo "version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # Move the tag/release to the latest main build for this version.
          # Bump the version in pom.xml to cut a new, separate release.
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: target/*.jar
