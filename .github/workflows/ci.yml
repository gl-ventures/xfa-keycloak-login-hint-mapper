name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting and basic validation. Runs on every push and pull request.
  validate:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate POM
        run: mvn -B -ntp validate

      - name: Compile
        # Compilation must succeed against the provided Keycloak SPIs.
        run: mvn -B -ntp clean compile

  # Build the provider jar and publish a GitHub Release. Only on main.
  build-and-release:
    name: Build & release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build package
        run: mvn -B -ntp clean package

      - name: Read project version
        id: version
        run: echo "version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # Move the tag/release to the latest main build for this version.
          # Bump the version in pom.xml to cut a new, separate release.
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: target/*.jar
